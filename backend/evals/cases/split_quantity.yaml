# VERIFIED BY HAND: no
#
# Synthetic eval bid evals/cases/bids/split_quantity.xlsx (see evals/make_eval_bids.py).
#
# How to check this file: open the bid document and compare every line below
# with it (item number, quantity, unit), check that production_rate is the
# right code from data/rate_cards/hvac_rate_card.json (or none), and that the
# required flags are the ones the planted problems call for. Then change the
# first line to "# VERIFIED BY HAND: yes".

id: split_quantity
title: "A line whose quantity is on its second row, a subtotal mid-table, an allowance"
bid_file: bids/split_quantity.xlsx

planted_problems:
  - "item A3 is split across two rows: number and first half of the description on R6, the rest with the quantity and unit on R7"
  - "a subtotal row in the middle of the table"
  - "units written in words: Each, Linear Feet, Pounds, Lump Sum"
  - "a decimal quantity (425.5) and one with a thousands separator (4,650)"
  - "item B3 is an allowance: a lump sum with no standard rate"

# Every bid line of the document, in document order.
lines:
  - item_number: "A1"
    description: "Split system condensing unit, 3 ton"
    quantity: "5"
    unit: "Each"
    production_rate: PR-CU-3T
  - item_number: "A2"
    description: "Split system air handler, 3 ton"
    quantity: "5"
    unit: "Each"
    production_rate: PR-AHU-3T
  # Rows R6 and R7 are one item: the item number is on R6, the quantity and unit on
  # R7. It must come back as ONE line, numbered A3, with quantity 5. Either row may
  # be cited as its source, so neither is listed under skip_rows; a second line
  # made from the other row counts as an extra line.
  - item_number: "A3"
    description: "Refrigerant line set, 3/8 x 7/8, 50 ft, insulated, installed"
    quantity: "5"
    unit: "Each"
    production_rate: PR-LINESET-50
    allowed_flags: [EXTRACTION_NOTE]
    problem: "line split across two rows"
  - item_number: "B1"
    description: "Insulated flexible duct, 8 in"
    quantity: "425.5"
    unit: "Linear Feet"
    production_rate: PR-DUCT-FLEX-8
    problem: "unit written in words, decimal quantity"
  # Written "4,650" in the document.
  - item_number: "B2"
    description: "Rectangular galvanized ductwork, fabricated and installed"
    quantity: "4650"
    unit: "Pounds"
    production_rate: PR-DUCT-RECT-GALV
    problem: "unit written in words, quantity with a comma"
  - item_number: "B3"
    description: "Testing, adjusting and balancing allowance"
    quantity: "1"
    unit: "Lump Sum"
    production_rate: none
    required_flags:
      - VAGUE_SCOPE
      - {any_of: [ASSUMED_PRODUCTION_RATE, NO_RATE_CARD_MATCH, NO_COMPONENTS]}
    allowed_flags: [LOW_CONFIDENCE_MAPPING]
    problem: "lump-sum allowance"

# Rows that must not come back as bid lines.
skip_rows:
  - ref: "Schedule!R1"
    text: "Bid Schedule - Maple Court Apartments, Building C |  |  | "
    why: "document title"
  - ref: "Schedule!R3"
    text: "Item | Description of Work | Quantity | Unit of Measure"
    why: "column header"
  - ref: "Schedule!R8"
    text: " | Subtotal - Section A | 15 | "
    why: "subtotal row mid-table"
