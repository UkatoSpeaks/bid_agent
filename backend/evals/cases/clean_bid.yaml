# VERIFIED BY HAND: no
#
# Sample bid data/bids/clean_bid.xlsx. Nothing is planted: this is the control case.
# Every line has a company production rate and no flag is required.
#
# How to check this file: open the bid document and compare every line below
# with it (item number, quantity, unit), check that production_rate is the
# right code from data/rate_cards/hvac_rate_card.json (or none), and that the
# required flags are the ones the planted problems call for. Then change the
# first line to "# VERIFIED BY HAND: yes".

id: clean_bid
title: "Clean bid: a tidy table of 10 items"
bid_file: ../../data/bids/clean_bid.xlsx

planted_problems: []

